<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Menu - Home chef's Restaurant</title>
    <style>
        body {margin:0;font-family:Arial, sans-serif;background:#f7f7f7;}
        .navbar{background:#333;overflow:hidden;}
        .navbar a{float:left;display:block;color:#f2f2f2;text-align:center;padding:14px 20px;text-decoration:none;transition:background .2s}
        .navbar a:hover,.navbar .active{background:#ff9800;color:#fff}
        @media (max-width:600px){.navbar a{float:none;display:block;text-align:left}}
        h1{color:#fff;background:#ff9800;padding:15px;text-align:center;margin-top:0}
        .menu-container{max-width:800px;margin:40px auto;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:30px 25px}
        .menu-section{margin-bottom:30px}
        .menu-section h2{color:#ff9800;border-bottom:1px solid #eee;padding-bottom:5px}
        .menu-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px dashed #eee}
        .menu-item:last-child{border-bottom:none}
        .item-info{display:flex;align-items:center;flex:1}
        .item-img{width:60px;height:60px;object-fit:cover;border-radius:8px;margin-right:18px;border:1px solid #ddd;background:#fafafa}
        .item-name{font-weight:bold;font-size:17px}
        .item-price{color:#ff9800;font-weight:bold;margin-left:18px;min-width:60px;text-align:right}
        .select-item{margin-left:18px;transform:scale(1.2);accent-color:#ff9800}
        .item-qty{width:56px;padding:6px;border-radius:6px;border:1px solid #ddd;text-align:center;margin-left:8px}
        .checkout-section{text-align:right;margin-top:30px}
        .checkout-btn{background:#ff9800;color:#fff;border:none;padding:12px 28px;border-radius:5px;font-size:17px;cursor:pointer;transition:background .2s}
        .checkout-btn:hover{background:#e65100}
        .order-message{display:none;margin:30px auto 0 auto;max-width:500px;background:#e0ffe0;color:#207520;border:1px solid #b2ffb2;border-radius:8px;padding:25px 20px;font-size:18px;text-align:center;font-weight:bold;animation:fadeIn .8s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

        /* Checkout modal */
        .modal {display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;overflow:auto;background:rgba(0,0,0,.5);align-items:center;justify-content:center}
        .modal-content{background:#fff;padding:20px;border-radius:10px;max-width:520px;width:94%}
        .form-row{display:flex;gap:10px;margin-bottom:12px}
        .form-row input,.form-row select,.form-row textarea{flex:1;padding:8px;border-radius:6px;border:1px solid #ddd}
        .modal .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
        .btn{background:#ff9800;color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer}
        .btn.secondary{background:#ddd;color:#333}

        @media (max-width:600px){.menu-item{flex-direction:column;align-items:flex-start}.item-info{margin-bottom:8px}.item-price,.select-item{margin-left:0}.checkout-section{text-align:center}.form-row{flex-direction:column}}
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="menu.html" class="active">Menu</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

    <h1>Our Menu</h1>

    <div class="menu-container" id="menuContainer">
        <form id="orderForm" onsubmit="return false;">
            <div class="menu-section">
                <h2>Starters</h2>
                <div class="menu-item">
                    <div class="item-info">
                        <img class="item-img" src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" alt="Tomato Soup">
                        <span class="item-name">Tomato Soup</span>
                    </div>
                    <span class="item-price">₹80</span>
                    <div>
                        <input type="checkbox" class="select-item" name="item" value="Tomato Soup" data-img="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" data-price="80">
                        <input type="number" class="item-qty" value="1" min="1" disabled>
                    </div>
                </div>
                <div class="menu-item">
                    <div class="item-info">
                        <img class="item-img" src="https://images.unsplash.com/photo-1519864600265-abb23847ef2c?auto=format&fit=crop&w=60&q=80" alt="Veg Spring Rolls">
                        <span class="item-name">Veg Spring Rolls</span>
                    </div>
                    <span class="item-price">₹120</span>
                    <div>
                        <input type="checkbox" class="select-item" name="item" value="Veg Spring Rolls" data-img="https://images.unsplash.com/photo-1519864600265-abb23847ef2c?auto=format&fit=crop&w=60&q=80" data-price="120">
                        <input type="number" class="item-qty" value="1" min="1" disabled>
                    </div>
                </div>
                <div class="menu-item">
                    <div class="item-info">
                        <img class="item-img" src="https://images.unsplash.com/photo-1502741338009-cac2772e18bc?auto=format&fit=crop&w=60&q=80" alt="Paneer Tikka">
                        <span class="item-name">Paneer Tikka</span>
                    </div>
                    <span class="item-price">₹150</span>
                    <div>
                        <input type="checkbox" class="select-item" name="item" value="Paneer Tikka" data-img="https://images.unsplash.com/photo-1502741338009-cac2772e18bc?auto=format&fit=crop&w=60&q=80" data-price="150">
                        <input type="number" class="item-qty" value="1" min="1" disabled>
                    </div>
                </div>
            </div>

            <div class="menu-section">
                <h2>Main Course</h2>
                <div class="menu-item">
                    <div class="item-info">
                        <img class="item-img" src="https://images.unsplash.com/photo-1464306076886-debca5e8a6b0?auto=format&fit=crop&w=60&q=80" alt="Butter Naan">
                        <span class="item-name">Butter Naan</span>
                    </div>
                    <span class="item-price">₹40</span>
                    <div>
                        <input type="checkbox" class="select-item" name="item" value="Butter Naan" data-img="https://images.unsplash.com/photo-1464306076886-debca5e8a6b0?auto=format&fit=crop&w=60&q=80" data-price="40">
                        <input type="number" class="item-qty" value="1" min="1" disabled>
                    </div>
                </div>
                <div class="menu-item">
                    <div class="item-info">
                        <img class="item-img" src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" alt="Paneer Butter Masala">
                        <span class="item-name">Paneer Butter Masala</span>
                    </div>
                    <span class="item-price">₹180</span>
                    <div>
                        <input type="checkbox" class="select-item" name="item" value="Paneer Butter Masala" data-img="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" data-price="180">
                        <input type="number" class="item-qty" value="1" min="1" disabled>
                    </div>
                </div>
                <div class="menu-item">
                    <div class="item-info">
                        <img class="item-img" src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" alt="Veg Biryani">
                        <span class="item-name">Veg Biryani</span>
                    </div>
                    <span class="item-price">₹160</span>
                    <div>
                        <input type="checkbox" class="select-item" name="item" value="Veg Biryani" data-img="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" data-price="160">
                        <input type="number" class="item-qty" value="1" min="1" disabled>
                    </div>
                </div>
            </div>

            <div class="menu-section">
                <h2>Desserts</h2>
                <div class="menu-item">
                    <div class="item-info">
                        <img class="item-img" src="https://images.unsplash.com/photo-1519864600265-abb23847ef2c?auto=format&fit=crop&w=60&q=80" alt="Gulab Jamun">
                        <span class="item-name">Gulab Jamun</span>
                    </div>
                    <span class="item-price">₹60</span>
                    <div>
                        <input type="checkbox" class="select-item" name="item" value="Gulab Jamun" data-img="https://images.unsplash.com/photo-1519864600265-abb23847ef2c?auto=format&fit=crop&w=60&q=80" data-price="60">
                        <input type="number" class="item-qty" value="1" min="1" disabled>
                    </div>
                </div>
                <div class="menu-item">
                    <div class="item-info">
                        <img class="item-img" src="https://images.unsplash.com/photo-1464306076886-debca5e8a6b0?auto=format&fit=crop&w=60&q=80" alt="Ice Cream">
                        <span class="item-name">Ice Cream</span>
                    </div>
                    <span class="item-price">₹70</span>
                    <div>
                        <input type="checkbox" class="select-item" name="item" value="Ice Cream" data-img="https://images.unsplash.com/photo-1464306076886-debca5e8a6b0?auto=format&fit=crop&w=60&q=80" data-price="70">
                        <input type="number" class="item-qty" value="1" min="1" disabled>
                    </div>
                </div>
            </div>

            <div class="checkout-section">
                <button type="button" class="checkout-btn" onclick="showCheckout()">Checkout</button>
            </div>
        </form>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <h3>Checkout - Enter Details</h3>
            <div class="form-row">
                <input id="custName" placeholder="Full name" type="text" required>
                <input id="custPhone" placeholder="Phone number" type="tel" required>
            </div>
            <div class="form-row">
                <textarea id="custAddress" placeholder="Delivery address" rows="3" required></textarea>
            </div>
            <div class="form-row">
                <select id="paymentMethod">
                    <option value="Cash on Delivery">Cash on Delivery</option>
                    <option value="UPI">UPI</option>
                    <option value="Card">Card</option>
                </select>
                <input id="deliveryTip" type="number" min="0" value="0" placeholder="Delivery tip (₹)">
            </div>
            <div class="modal-actions">
                <button class="btn secondary" onclick="hideCheckout()">Cancel</button>
                <button class="btn" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>

    <div class="order-message" id="orderMessage"></div>

    <script>
        // Toggle qty input when checkbox changes
        document.querySelectorAll('.select-item').forEach(cb => {
            cb.addEventListener('change', function() {
                const qty = this.closest('.menu-item').querySelector('.item-qty');
                qty.disabled = !this.checked;
                if (!this.checked) qty.value = 1;
            });
        });

        function showCheckout() {
            const checked = document.querySelectorAll('.select-item:checked');
            if (checked.length === 0) {
                alert('Please select at least one item to place your order.');
                return;
            }
            document.getElementById('checkoutModal').style.display = 'flex';
        }
        function hideCheckout() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        // Build the order object and save full details
        function placeOrder() {
            const checkboxes = document.querySelectorAll('.select-item:checked');
            if (checkboxes.length === 0) {
                alert('Please select at least one item.');
                return;
            }

            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const payment = document.getElementById('paymentMethod').value;
            const tip = Number(document.getElementById('deliveryTip').value || 0);

            if (!name || !phone || !address) {
                alert('Please fill in your name, phone and address.');
                return;
            }

            const items = [];
            let subtotal = 0;

            checkboxes.forEach(cb => {
                const parent = cb.closest('.menu-item');
                const qtyInput = parent.querySelector('.item-qty');
                const qty = Math.max(1, parseInt(qtyInput.value) || 1);
                const price = Number(cb.dataset.price);
                const itemSubtotal = price * qty;
                subtotal += itemSubtotal;
                items.push({
                    name: cb.value,
                    img: cb.dataset.img,
                    price: price,
                    qty: qty,
                    subtotal: itemSubtotal
                });
            });

            const tax = Math.round(subtotal * 0.05); // 5% tax
            const deliveryFee = subtotal > 499 ? 0 : 30; // small logic for delivery fee
            const total = subtotal + tax + deliveryFee + tip;

            const order = {
                id: 'ORD-' + Date.now(),
                date: new Date().toISOString(),
                customer: { name, phone, address },
                paymentMethod: payment,
                items: items,
                subtotal,
                tax,
                deliveryFee,
                tip,
                total,
                status: 'Placed'
            };

            // Save to an array of orders and to lastOrder
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.push(order);
            localStorage.setItem('orders', JSON.stringify(orders));
            localStorage.setItem('lastOrder', JSON.stringify(order));

            // Confirmation and redirect to order-details
            const orderMessage = document.getElementById('orderMessage');
            orderMessage.innerHTML = `Order placed!<br>Order ID: ${order.id}<br>Your order has been received. Redirecting...`;
            orderMessage.style.display = 'block';
            document.getElementById('checkoutModal').style.display = 'none';

            setTimeout(() => {
                window.location.href = 'order-details.html';
            }, 1200);
        }
    </script>
</body>
</html>
