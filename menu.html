<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Home chef's Restaurant</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }
        .navbar {
            background-color: #333;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .navbar a:hover, .navbar .active {
            background-color: #ff9800;
            color: #fff;
        }
        @media (max-width: 600px) {
            .navbar a {
                float: none;
                display: block;
                text-align: left;
            }
        }
        h1 {
            color: #fff;
            background-color: #ff9800;
            padding: 15px;
            text-align: center;
            margin-top: 0;
        }
        .menu-container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 30px 25px;
        }
        .menu-section {
            margin-bottom: 30px;
        }
        .menu-section h2 {
            color: #ff9800;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px dashed #eee;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .item-info {
            display: flex;
            align-items: center;
            flex: 1;
        }
        .item-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 18px;
            border: 1px solid #ddd;
            background: #fafafa;
        }
        .item-name {
            font-weight: bold;
            font-size: 17px;
        }
        .item-price {
            color: #ff9800;
            font-weight: bold;
            margin-left: 18px;
            min-width: 60px;
            text-align: right;
        }
        .select-item {
            margin-left: 18px;
            transform: scale(1.3);
            accent-color: #ff9800;
        }
        .checkout-section {
            text-align: right;
            margin-top: 30px;
        }
        .checkout-btn {
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .checkout-btn:hover {
            background: #e65100;
        }
        .order-message {
            display: none;
            margin: 30px auto 0 auto;
            max-width: 500px;
            background: #e0ffe0;
            color: #207520;
            border: 1px solid #b2ffb2;
            border-radius: 8px;
            padding: 25px 20px;
            font-size: 20px;
            text-align: center;
            font-weight: bold;
            animation: fadeIn 0.8s;
        }
        .order-details {
            margin-top: 20px;
            text-align: left;
            font-size: 17px;
            color: #333;
        }
        .order-details ul {
            list-style: none;
            padding: 0;
        }
        .order-details li {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            background: #fff;
            border-radius: 6px;
            padding: 8px 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .order-details img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 14px;
            border: 1px solid #eee;
        }
        .order-details .item-name {
            font-weight: bold;
            margin-right: 10px;
        }
        .order-details .item-price {
            color: #ff9800;
            font-weight: bold;
            margin-left: auto;
        }
        .order-details .total {
            font-size: 18px;
            font-weight: bold;
            color: #207520;
            margin-top: 10px;
            text-align: right;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px);}
            to { opacity: 1; transform: translateY(0);}
        }
        @media (max-width: 600px) {
            .menu-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .item-info {
                margin-bottom: 8px;
            }
            .item-price, .select-item {
                margin-left: 0;
            }
            .checkout-section {
                text-align: center;
            }
            .order-message {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="menu.html" class="active">Menu</a>
        <a href="about.html">About</a>
    </div>
    <h1>Our Menu</h1>
    <div class="menu-container" id="menuContainer">
        <form id="orderForm" onsubmit="return false;">
        <div class="menu-section">
            <h2>Starters</h2>
            <div class="menu-item">
                <div class="item-info">
                    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" alt="Tomato Soup" class="item-img">
                    <span class="item-name">Tomato Soup</span>
                </div>
                <span class="item-price">₹80</span>
                <input type="checkbox" class="select-item" name="item" value="Tomato Soup" data-img="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" data-price="80">
            </div>
            <div class="menu-item">
                <div class="item-info">
                    <img src="https://images.unsplash.com/photo-1519864600265-abb23847ef2c?auto=format&fit=crop&w=60&q=80" alt="Veg Spring Rolls" class="item-img">
                    <span class="item-name">Veg Spring Rolls</span>
                </div>
                <span class="item-price">₹120</span>
                <input type="checkbox" class="select-item" name="item" value="Veg Spring Rolls" data-img="https://images.unsplash.com/photo-1519864600265-abb23847ef2c?auto=format&fit=crop&w=60&q=80" data-price="120">
            </div>
            <div class="menu-item">
                <div class="item-info">
                    <img src="https://images.unsplash.com/photo-1502741338009-cac2772e18bc?auto=format&fit=crop&w=60&q=80" alt="Paneer Tikka" class="item-img">
                    <span class="item-name">Paneer Tikka</span>
                </div>
                <span class="item-price">₹150</span>
                <input type="checkbox" class="select-item" name="item" value="Paneer Tikka" data-img="https://images.unsplash.com/photo-1502741338009-cac2772e18bc?auto=format&fit=crop&w=60&q=80" data-price="150">
            </div>
        </div>
        <div class="menu-section">
            <h2>Main Course</h2>
            <div class="menu-item">
                <div class="item-info">
                    <img src="https://images.unsplash.com/photo-1464306076886-debca5e8a6b0?auto=format&fit=crop&w=60&q=80" alt="Butter Naan" class="item-img">
                    <span class="item-name">Butter Naan</span>
                </div>
                <span class="item-price">₹40</span>
                <input type="checkbox" class="select-item" name="item" value="Butter Naan" data-img="https://images.unsplash.com/photo-1464306076886-debca5e8a6b0?auto=format&fit=crop&w=60&q=80" data-price="40">
            </div>
            <div class="menu-item">
                <div class="item-info">
                    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" alt="Paneer Butter Masala" class="item-img">
                    <span class="item-name">Paneer Butter Masala</span>
                </div>
                <span class="item-price">₹180</span>
                <input type="checkbox" class="select-item" name="item" value="Paneer Butter Masala" data-img="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" data-price="180">
            </div>
            <div class="menu-item">
                <div class="item-info">
                    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" alt="Veg Biryani" class="item-img">
                    <span class="item-name">Veg Biryani</span>
                </div>
                <span class="item-price">₹160</span>
                <input type="checkbox" class="select-item" name="item" value="Veg Biryani" data-img="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=60&q=80" data-price="160">
            </div>
        </div>
        <div class="menu-section">
            <h2>Desserts</h2>
            <div class="menu-item">
                <div class="item-info">
                    <img src="https://images.unsplash.com/photo-1519864600265-abb23847ef2c?auto=format&fit=crop&w=60&q=80" alt="Gulab Jamun" class="item-img">
                    <span class="item-name">Gulab Jamun</span>
                </div>
                <span class="item-price">₹60</span>
                <input type="checkbox" class="select-item" name="item" value="Gulab Jamun" data-img="https://images.unsplash.com/photo-1519864600265-abb23847ef2c?auto=format&fit=crop&w=60&q=80" data-price="60">
            </div>
            <div class="menu-item">
                <div class="item-info">
                    <img src="https://images.unsplash.com/photo-1464306076886-debca5e8a6b0?auto=format&fit=crop&w=60&q=80" alt="Ice Cream" class="item-img">
                    <span class="item-name">Ice Cream</span>
                </div>
                <span class="item-price">₹70</span>
                <input type="checkbox" class="select-item" name="item" value="Ice Cream" data-img="https://images.unsplash.com/photo-1464306076886-debca5e8a6b0?auto=format&fit=crop&w=60&q=80" data-price="70">
            </div>
        </div>
        <div class="checkout-section">
            <button type="button" class="checkout-btn" onclick="placeOrder()">Checkout</button>
        </div>
        </form>
    </div>
    <div class="order-message" id="orderMessage">
        Order placed!<br>Your order has been received.<br>Thank you!
        <div class="order-details" id="orderDetails"></div>
    </div>
    <script>
        function placeOrder() {
            // Gather selected items
            const checkboxes = document.querySelectorAll('.select-item:checked');
            if (checkboxes.length === 0) {
                alert('Please select at least one item to place your order.');
                return;
            }
            let orderHTML = '<ul>';
            let total = 0;
            checkboxes.forEach(cb => {
                const name = cb.value;
                const img = cb.getAttribute('data-img');
                const price = parseInt(cb.getAttribute('data-price'));
                total += price;
                orderHTML += `<li>
                    <img src="${img}" alt="${name}">
                    <span class="item-name">${name}</span>
                    <span class="item-price">₹${price}</span>
                </li>`;
            });
            orderHTML += '</ul>';
            orderHTML += `<div class="total">Total: ₹${total}</div>`;
            document.getElementById('orderDetails').innerHTML = orderHTML;
            document.getElementById('menuContainer').style.display = 'none';
            document.getElementById('orderMessage').style.display = 'block';
        }
    </script>
</body>
</html>
